<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- On a phone the page shrinks above the keyboard, as Claude Code on the web asks, rather than the keyboard lying over it and the page scrolled up under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>OpenAgent</title>
    <!-- The brand mark as the tab icon (#757). It carries its own dark-mode ramp inside the file:
         a favicon sits on browser chrome, which follows the OS theme, not our in-app theme choice. -->
    <link rel="icon" href="/logo.svg" />
    <!-- The landing page's typeface (#1118) so the dashboard reads as the same product as
         openagent.build: IBM Plex Sans for UI, IBM Plex Mono for code. Same Google Fonts links as
         packages/openagent.build/pages/+Head.tsx. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
