name: CI
# A pull request is verified by its own event, and the main branch by its pushes. A push to another
# branch runs nothing: with both events a pull request got two runs, and the skipped twin's "build"
# check read as green before the real one existed.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      # A red part does not stop the others: one run says everything that is wrong.
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            run: pnpm typecheck
          - name: dashboard browser tests
            run: pnpm -C packages/dashboard test:dashboard
          - name: dashboard node tests
            run: pnpm -C packages/dashboard test:node
          # The browser extension the dashboard ships (packages/chrome-extension, no package of its own).
          - name: chrome extension check
            run: pnpm -C packages/dashboard test:extension
          # --no-bail: a red package does not stop the next one either.
          - name: agent packages tests
            run: pnpm -r --workspace-concurrency=1 --no-bail --filter @openagt/agent-runner --filter @openagt/skill-scheduler --filter @openagt/skill-orchestration run test
          # Every other package, named by what it is not: a new package's tests run here.
          - name: other packages tests
            run: pnpm -r --workspace-concurrency=1 --no-bail --filter '!@openagt/dashboard' --filter '!@openagt/agent-runner' --filter '!@openagt/skill-scheduler' --filter '!@openagt/skill-orchestration' run test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: ${{ matrix.run }}
      # A browser smoke story that failed left a screenshot of its page there.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ strategy.job-index }}
          path: packages/*/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The one check the merge rule on main waits for: green only when every part above is.
  build:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success
